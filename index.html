<!DOCTYPE html>
<html style="background-color: #2A4B71;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#2A4B71">
  <title>にじカレ+α</title>
  <link rel="icon" type="image/png" href="test.png">
  <link rel="apple-touch-icon" href="icon.png">
  <style>
    :root {
      --bg-color: #2A4B71;
      --card-w: 260px; 
      --lane-h: calc((100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 60px) / 8); 
      --accent: #70a1ff;
      --time-color: #d1d8e0;
      --upcoming-opacity: 0.4; 
    }
    body {
      margin: 0; padding: 0;
      height: 100dvh; width: 100vw;
      background-color: var(--bg-color);
      color: white;
      font-family: -apple-system, "Noto Sans TC", sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
    }

    #viewport {
      width: 100vw; height: 100%;
      overflow-x: auto; overflow-y: hidden;
      position: relative;
      -webkit-overflow-scrolling: touch;
    }

    #timeline-content {
      position: relative; height: 100%;
      background-color: var(--bg-color);
    }

    .day-header {
      background: rgba(20, 40, 65, 0.96);
      padding: 6px 12px;
      font-size: 0.95rem; font-weight: bold;
      letter-spacing: 1px; 
      position: sticky; 
      top: env(safe-area-inset-top); 
      left: 0;
      width: fit-content; z-index: 100;
      backdrop-filter: blur(10px);
      border-radius: 0 10px 10px 0; 
      transition: all 0.2s ease; 
    }

    .hour-box {
      position: absolute; top: 0; bottom: 0;
      z-index: 0; 
      pointer-events: none;
      box-sizing: border-box; 
    }

    .time-col {
      position: absolute;
      top: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center; 
      transform: translateX(-50%); 
      pointer-events: none;
      z-index: 1;
    }

    .time-col .hour-text {
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      white-space: nowrap;
      line-height: 1;
    }

    .time-col .hour-text.top {
      margin-top: calc(env(safe-area-inset-top) + 8px);
    }
    .time-col .hour-text.bottom {
      margin-bottom: calc(env(safe-area-inset-bottom) + 8px);
    }

    .time-col .hour-line {
      width: 1px;
      flex-grow: 1; 
      background-color: rgba(255, 255, 255, 0.12);
      margin-top: 6px; 
      margin-bottom: 6px; 
    }

    /* 虛線樣式 */
    .time-col .hour-line.dotted {
      background-color: transparent; 
      border-left: 1px dashed rgba(255, 255, 255, 0.3);
    }

    /* 拓寬時隱藏整點實線背景 */
    .hour-box.expanded .time-col .hour-line:not(.dotted) {
      background-color: transparent; 
    }
    
    .hour-box.expanded {
      border: none;
      background: linear-gradient(to right, 
        rgba(255, 255, 255, 0.2) 0%, 
        rgba(255, 255, 255, 0) 15%, 
        rgba(255, 255, 255, 0) 85%, 
        rgba(255, 255, 255, 0.2) 100%
      );
      box-shadow: none; 
    }
    
    .stream-card {
      position: absolute;
      width: var(--card-w); 
      height: calc(var(--lane-h) - 6px); 
      background: rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      display: flex; text-decoration: none; color: white;
      overflow: hidden; z-index: 2;
      box-shadow: 2px 2px 8px rgba(0,0,0,0.2);
      opacity: var(--upcoming-opacity); 
      transition: opacity 0.3s ease;
    }

    .stream-card.is-live {
      opacity: 1;
      background: rgba(255, 255, 255, 0.15);
    }

    .thumb-container {
      position: relative;
      height: 100%;
      aspect-ratio: 16 / 9;
      flex-shrink: 0;
    }

    .thumb { 
      width: 100%;
      height: 100%; 
      object-fit: cover; 
    }

    .thumb-time {
      position: absolute;
      bottom: 4px;
      right: 4px;
      background: rgba(0, 0, 0, 0.75);
      color: var(--time-color);
      font-size: 0.75rem;
      padding: 2px 5px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }
    
    .info { 
      padding: 4px 15px 4px 8px; 
      display: flex; flex-direction: column; justify-content: center; 
      min-width: 0; flex-grow: 1;
    }
    
    .liver-row {
      font-size: 0.9rem; color: var(--accent);
      margin-bottom: 4px; 
      display: flex; justify-content: space-between; align-items: center;
      width: 100%;
    }
    
    .liver-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-grow: 1;
    }

    .title {
      font-size: 0.8rem; line-height: 1.3;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }

    .pad-no { padding-left: 7.5px; }
    .pad-with { padding-left: 1px; }

    .loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); opacity: 0.5; }
    
    .credit-tag {
      position: fixed;
      bottom: max(10px);
      right: 15px;
      font-size: 10px;
      color: rgba(255, 255, 255, 0.5);
      z-index: 100;
      pointer-events: none; 
    }
    .credit-tag a {
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
      pointer-events: auto; 
    }
  </style>
</head>
<body>
  <div id="loading" class="loading">正在向 API 獲取 8 軌河道...</div>
  <div id="viewport">
    <div id="timeline-content"></div>
  </div>

  <div class="credit-tag">Powered by <a href="https://holodex.net/" target="_blank">Holodex</a></div>

  <script>
    const API_URL = 'https://fragrant-violet-32a4.neiforscience.workers.dev/';

    window.onload = () => {
      fetch(API_URL)
        .then(response => response.json())
        .then(data => render(data))
        .catch(error => {
          document.getElementById('loading').innerHTML = "❌ 載入失敗，請檢查 API 網址是否正確";
          console.error(error);
        });
    };

    function render(data) {
      document.getElementById('loading').style.display = 'none';
      const viewport = document.getElementById('viewport');
      const container = document.getElementById('timeline-content');
      
      if (!data || data.length === 0) {
        container.innerHTML = '<div style="padding: 20px;">目前沒有直播預定</div>';
        return;
      }

      data.sort((a, b) => a.startTime - b.startTime);

      const hourPx = 280; 
      const startHour = new Date(data[0].startTime).setMinutes(0,0,0);
      const maxTime = Math.max(...data.map(item => item.startTime));
      const totalHours = Math.ceil((maxTime - startHour) / 3600000) + 4; 
      
      const cardW_px = 260; 

      // ==========================================
      // 🔍 幾何數學拓寬機制 (直接捨棄迴圈，零當機風險)
      // ==========================================
      let hourW = new Array(totalHours).fill(hourPx);
      let hourX = new Array(totalHours + 1).fill(0);
      let cardsInHour = new Array(totalHours).fill(0);

      // 先統計每個小時有幾個直播
      data.forEach(item => {
        let hIdx = Math.floor((item.startTime - startHour) / 3600000);
        if (hIdx >= 0 && hIdx < totalHours) {
           cardsInHour[hIdx]++;
        }
      });

      // 依照數量決定倍數 (超過 8 個就拓寬，每多 8 個增加一倍)
      for (let i = 0; i < totalHours; i++) {
        if (cardsInHour[i] > 8) {
            const multiplier = Math.ceil(cardsInHour[i] / 8);
            hourW[i] = hourPx * multiplier;
        }
        hourX[i+1] = hourX[i] + hourW[i];
      }

      // ==========================================
      // 📐 正式建立時間帶寬度與背景 (含虛線產生器)
      // ==========================================
      container.style.width = (hourX[totalHours] + 20) + 'px';

      const dHead = document.createElement('div');
      dHead.className = 'day-header';
      const initialDObj = new Date(data[0].startTime);
      dHead.innerText = `${initialDObj.getFullYear()}.${initialDObj.getMonth()+1}.${initialDObj.getDate()}`;
      container.appendChild(dHead);

      for(let i=0; i < totalHours; i++) {
        const box = document.createElement('div');
        box.className = 'hour-box';
        box.style.left = hourX[i] + 'px';
        box.style.width = hourW[i] + 'px';

        if (hourW[i] > hourPx) {
            box.classList.add('expanded');
        }

        const multiplier = Math.round(hourW[i] / hourPx);
        let innerHTML = '';

        // 根據倍數，動態產生內部的等分標記與虛線
        for (let k = 0; k < multiplier; k++) {
          const markTime = new Date(startHour + i*3600000 + k * (3600000 / multiplier));
          const hStr = markTime.getHours().toString().padStart(2, '0');
          const mStr = markTime.getMinutes().toString().padStart(2, '0');
          
          const timeText = (k === 0) ? `${hStr}:00` : `${hStr}:${mStr}`;
          const lineClass = (k === 0) ? 'hour-line' : 'hour-line dotted';
          const leftPct = (k * 100) / multiplier; 

          innerHTML += `
            <div class="time-col" style="left: ${leftPct}%;">
              <span class="hour-text top">${timeText}</span>
              <div class="${lineClass}"></div>
              <span class="hour-text bottom">${timeText}</span>
            </div>
          `;
        }
        
        box.innerHTML = innerHTML;
        container.appendChild(box);
      }
      
      const lastLine = document.createElement('div');
      lastLine.className = 'hour-box';
      lastLine.style.left = hourX[totalHours] + 'px';
      lastLine.innerHTML = `
        <div class="time-col" style="left: 0%;">
          <span class="hour-text top">${new Date(startHour + totalHours*3600000).getHours()}:00</span>
          <div class="hour-line"></div>
          <span class="hour-text bottom">${new Date(startHour + totalHours*3600000).getHours()}:00</span>
        </div>
      `;
      container.appendChild(lastLine);

      // ==========================================
      // 🎨 正式畫出完美對齊的卡片
      // ==========================================
      let laneLastEnds = new Array(8).fill(0);

      data.forEach(item => {
        let hIdx = Math.floor((item.startTime - startHour) / 3600000);
        let fraction = ((item.startTime - startHour) % 3600000) / 3600000;
        
        let targetX = 0;
        if (hIdx >= 0 && hIdx < totalHours) {
           targetX = hourX[hIdx] + fraction * hourW[hIdx];
        } else {
           targetX = hourX[totalHours]; 
        }

        let finalLane = -1;
        let minWaitX = Infinity;
        let bestLane = 0;

        for(let j=0; j<8; j++) {
          if (targetX >= laneLastEnds[j]) {
            finalLane = j;
            break;
          }
          if (laneLastEnds[j] < minWaitX) {
            minWaitX = laneLastEnds[j];
            bestLane = j;
          }
        }

        if (finalLane === -1) {
          finalLane = bestLane;
          targetX = minWaitX + 15; 
        }

        laneLastEnds[finalLane] = targetX + cardW_px + 10; 

        const d = new Date(item.startTime);
        const timeStr = d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
        const cardClass = (item.status === 'live') ? 'stream-card is-live' : 'stream-card';
        const hasBracket = item.title.trim().startsWith('【');
        const titleClass = hasBracket ? 'title pad-with' : 'title pad-no';

        const card = document.createElement('a');
        card.href = item.link;
        card.className = cardClass;
        card.style.left = targetX + 'px';
        card.style.top = `calc(${finalLane} * var(--lane-h) + env(safe-area-inset-top) + 45px)`; 

        card.innerHTML = `
          <div class="thumb-container">
            <img class="thumb" src="${item.thumbnail}">
            <div class="thumb-time">${timeStr}</div>
          </div>
          <div class="info">
            <div class="liver-row">
              <span class="liver-name">【${item.liver}】</span>
            </div>
            <div class="${titleClass}">${item.title}</div>
          </div>
        `;
        container.appendChild(card);
      });
      
      let nowHIdx = Math.floor((Date.now() - startHour) / 3600000);
      let nowFraction = ((Date.now() - startHour) % 3600000) / 3600000;
      let nowX = 0;
      if (nowHIdx >= 0 && nowHIdx < totalHours) {
          nowX = hourX[nowHIdx] + nowFraction * hourW[nowHIdx];
      }
      if (nowX > 0) {
        viewport.scrollLeft = nowX - 100;
      }

      viewport.addEventListener('scroll', () => {
        const checkX = viewport.scrollLeft + 20; 
        
        let currentHIdx = 0;
        for(let i=0; i<totalHours; i++) {
           if (checkX >= hourX[i] && checkX < hourX[i+1]) {
              currentHIdx = i;
              break;
           }
        }
        
        const currentRefTime = new Date(startHour + currentHIdx * 3600000);
        const newDateText = `${currentRefTime.getFullYear()}.${currentRefTime.getMonth()+1}.${currentRefTime.getDate()}`;
        
        if (dHead.innerText !== newDateText) {
          dHead.innerText = newDateText;
        }
      });
    }
  </script>
</body>
</html>
